<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <link rel="stylesheet" href="./styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="box">
        <div class="frame">
            <div class="timebox hrs">00</div>
            <div class="colon">:</div>
            <div class="timebox min">00</div>
            <div class="colon">:</div>
            <div class="timebox sec">00</div>
            <div class="colon">:</div>            
            <div class="timebox msec">00</div>
        </div>
        <div class="buttons">
            <button class="start btn btn-success">Start</button>
            <button class="stop stop-active btn btn-primary">Stop</button>
            <button class="reset btn btn-secondary">Reset</button>
        </div>
    </div>
    
    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
